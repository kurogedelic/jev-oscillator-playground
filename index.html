<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev Oscillator Playground</title><style>
:root{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#f3f3f1;color:#111}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1040px;margin:auto;padding:52px 28px 70px}h1{font-size:clamp(36px,7vw,76px);line-height:.92;letter-spacing:-.055em;margin:0;font-weight:700}.sub{font-size:15px;color:#666;margin:16px 0 42px}.label{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;margin:22px 0 8px}.card{background:#fff;border:1px solid #d7d7d2;padding:24px}.prompt{display:flex;gap:10px}textarea{width:100%;min-height:86px;resize:vertical;border:1px solid #bbb;padding:14px;font:16px/1.4 inherit;background:#fafafa}button{border:1px solid #111;background:#111;color:#fff;padding:13px 18px;font:700 12px inherit;letter-spacing:.04em;cursor:pointer}button.secondary{background:transparent;color:#111}button:hover{opacity:.72}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#status{font-size:12px;color:#777;align-self:center;margin-left:5px}.scope{margin-top:20px;background:#111;padding:1px}canvas{display:block;width:100%;height:320px;touch-action:none}.samples{display:grid;grid-template-columns:repeat(16,1fr);gap:1px;background:#ccc;border:1px solid #ccc;margin-top:12px}.samples input{width:100%;min-width:0;border:0;padding:7px 2px;text-align:center;font:12px Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff}.foot{color:#777;font-size:12px;margin-top:14px}@media(max-width:650px){.wrap{padding:30px 16px}.prompt{display:block}.samples{grid-template-columns:repeat(8,1fr)}canvas{height:240px}}</style></head><body><main class="wrap">
<h1>Jev Oscillator<br>Playground</h1><p class="sub">A 32 × 4-bit waveform experiment driven by Jev.</p>
<section class="card"><div class="label">Describe a waveform</div><div class="prompt"><textarea id="prompt">rusty broken digital organ, hollow and slightly unstable</textarea></div>
<div class="actions"><button id="gen">Generate with Jev</button><button class="secondary" id="play">Play A4</button><button class="secondary" id="rnd">Randomize</button><span id="status">Ready.</span></div></section>
<div class="scope"><canvas id="scope" width="1000" height="320"></canvas></div><div id="samples" class="samples"></div>
<p class="foot">32 samples · 4-bit · drag the waveform to edit · API key stays in your local environment.</p>
</main><script>
const N=32;let w=Array.from({length:N},(_,i)=>Math.round((Math.sin(i/N*Math.PI*2)+1)*7.5));const q=id=>document.getElementById(id),c=q("scope"),g=c.getContext("2d");
function draw(){g.clearRect(0,0,c.width,c.height);g.strokeStyle="#292929";g.lineWidth=1;for(let y=0;y<16;y++){g.beginPath();g.moveTo(0,y/15*c.height);g.lineTo(c.width,y/15*c.height);g.stroke()}g.strokeStyle="#f3f3f1";g.lineWidth=3;g.beginPath();w.forEach((v,i)=>{let x=i/(N-1)*c.width,y=c.height-v/15*c.height;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();[...q("samples").children].forEach((e,i)=>e.value=w[i])}
for(let i=0;i<N;i++){let e=document.createElement("input");e.type="number";e.min=0;e.max=15;e.oninput=()=>{w[i]=Math.max(0,Math.min(15,+e.value||0));draw()};q("samples").append(e)}
let down=false;function paint(e){let r=c.getBoundingClientRect(),i=Math.round((e.clientX-r.left)/r.width*31),v=Math.round((1-(e.clientY-r.top)/r.height)*15);w[Math.max(0,Math.min(31,i))]=Math.max(0,Math.min(15,v));draw()}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);paint(e)};c.onpointermove=e=>down&&paint(e);c.onpointerup=()=>down=false;
q("rnd").onclick=()=>{w=w.map(()=>Math.floor(Math.random()*16));draw()};
q("play").onclick=async()=>{let a=new AudioContext();await a.resume();let r=new Float32Array(17),im=new Float32Array(17),x=w.map(v=>(v-7.5)/7.5);for(let k=1;k<=16;k++)for(let n=0;n<32;n++){let z=2*Math.PI*k*n/32;r[k]+=x[n]*Math.cos(z)*2/32;im[k]-=x[n]*Math.sin(z)*2/32}let o=a.createOscillator(),v=a.createGain();o.setPeriodicWave(a.createPeriodicWave(r,im));o.frequency.value=440;v.gain.setValueAtTime(.18,a.currentTime);v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+1.2);o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+1.25)};
q("gen").onclick=async()=>{q("status").textContent="Generating…";try{let res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({description:q("prompt").value})});let d=await res.json();if(!res.ok)throw Error(d.error?.message||d.error||d.message||"HTTP "+res.status);w=Array.from({length:32},(_,i)=>Math.max(0,Math.min(15,parseInt(d.answers?.["s"+i]?.choice,10)||0)));draw();q("status").textContent="Generated."}catch(e){q("status").textContent="Error: "+e.message}};
draw();</script></body></html>
