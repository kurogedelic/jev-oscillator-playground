<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Jev Oscillator Playground</title><style>
body{font:15px monospace;background:#111;color:#eee;max-width:900px;margin:30px auto;padding:0 16px}input,textarea,button{font:inherit;background:#181818;color:#eee;border:1px solid #555;padding:9px}textarea,input{width:100%;box-sizing:border-box}textarea{height:70px}button{margin:8px 5px 8px 0}canvas{width:100%;height:280px;border:1px solid #555;touch-action:none}.samples{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}.samples input{text-align:center;padding:4px}.muted{color:#999}.bad{color:#e99}</style></head><body>
<h1>Jev Oscillator Playground</h1><p class="muted">32 × 4-bit wavetable generator.</p>
<p>TypeSafe API key</p><input id="key" type="password" placeholder="Paste your own key for this session">
<p>Describe a waveform</p><textarea id="prompt">rusty broken digital organ, hollow and slightly unstable</textarea><br>
<button id="gen">GENERATE WITH JEV</button><button id="play">PLAY A4</button><button id="rnd">RANDOMIZE</button><span id="status" class="muted">Ready.</span>
<canvas id="scope" width="900" height="280"></canvas><div id="samples" class="samples"></div>
<p class="muted">Jev runs only when Generate is pressed. Audio runs locally with Web Audio.</p>
<script>
const N=32;let w=Array.from({length:N},(_,i)=>Math.round((Math.sin(i/N*6.283)+1)*7.5));const q=x=>document.getElementById(x),c=q('scope'),g=c.getContext('2d');
function draw(){g.clearRect(0,0,c.width,c.height);g.strokeStyle='#333';for(let y=0;y<16;y++){g.beginPath();g.moveTo(0,y/15*c.height);g.lineTo(c.width,y/15*c.height);g.stroke()}g.strokeStyle='#eee';g.lineWidth=3;g.beginPath();w.forEach((v,i)=>{let x=i/(N-1)*c.width,y=c.height-v/15*c.height;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();[...q('samples').children].forEach((e,i)=>e.value=w[i])}
for(let i=0;i<N;i++){let e=document.createElement('input');e.type='number';e.min=0;e.max=15;e.oninput=()=>{w[i]=Math.max(0,Math.min(15,+e.value||0));draw()};q('samples').append(e)}
let down=false;function paint(e){let r=c.getBoundingClientRect(),i=Math.round((e.clientX-r.left)/r.width*31),v=Math.round((1-(e.clientY-r.top)/r.height)*15);w[Math.max(0,Math.min(31,i))]=Math.max(0,Math.min(15,v));draw()}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);paint(e)};c.onpointermove=e=>down&&paint(e);c.onpointerup=()=>down=false;
q('rnd').onclick=()=>{w=w.map(()=>Math.floor(Math.random()*16));draw()};
q('play').onclick=async()=>{let a=new AudioContext();await a.resume();let r=new Float32Array(17),im=new Float32Array(17),x=w.map(v=>(v-7.5)/7.5);for(let k=1;k<=16;k++)for(let n=0;n<32;n++){let z=2*Math.PI*k*n/32;r[k]+=x[n]*Math.cos(z)*2/32;im[k]-=x[n]*Math.sin(z)*2/32}let o=a.createOscillator(),v=a.createGain();o.setPeriodicWave(a.createPeriodicWave(r,im));o.frequency.value=440;v.gain.setValueAtTime(.18,a.currentTime);v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+1.2);o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+1.25)};
q('gen').onclick=async()=>{let key=q('key').value.trim();if(!key){q('status').textContent='Enter a key.';return}q('status').textContent='Generating…';let criteria={};for(let j=0;j<16;j++)criteria[j]=null;let questions={};for(let i=0;i<32;i++)questions['s'+i]={type:'choice',instructions:'Choose amplitude 0-15 for sample '+i+' of 32 at phase '+i+'/32 of one coherent periodic oscillator waveform.',criteria};try{let res=await fetch('https://api.typesafe.ai/v1/systemone',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:'jev-latest',state:{task:'Design one coherent 32-sample 4-bit oscillator wavetable.',description:q('prompt').value},questions})});let d=await res.json();if(!res.ok)throw Error(d.message||'HTTP '+res.status);w=Array.from({length:32},(_,i)=>Math.max(0,Math.min(15,parseInt(d.answers['s'+i].choice))));draw();q('status').textContent='Generated.'}catch(e){q('status').textContent='API error: '+e.message;q('status').className='bad'}};
draw();</script></body></html>
